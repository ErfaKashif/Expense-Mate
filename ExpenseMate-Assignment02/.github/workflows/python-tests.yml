name: ExpenseMate CI Pipeline

on:
  push:
    branches: [ main, master, assignment-02, US-Fix ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Throw-away PostgreSQL server used only by the test-suite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: expensemate
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: expensemate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expensemate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: .
      TEST_DATABASE_URL: postgresql://expensemate:ci-only-password@localhost:5432/expensemate_test
      JWT_SECRET_KEY: ci-only-jwt-secret-key-not-used-in-production

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite (unit, integration, regression)
      run: |
        pytest -v --cov=app/backend --cov=migration --cov-report=term-missing
